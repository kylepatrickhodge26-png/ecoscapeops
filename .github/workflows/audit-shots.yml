# AUDIT ONLY (removed before merging): screenshots of every page with realistic data, saved to
# the audit-shots branch.
name: Audit screenshots

on:
  push:
    branches: [claude/audit, claude/audit-tour]

permissions:
  contents: write

concurrency:
  group: audit-shots
  cancel-in-progress: true

defaults:
  run:
    working-directory: ecoscape-ops

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FAKE_SERVICES_PORT: "4010"
      NWS_BASE_URL: http://127.0.0.1:4010
      CENSUS_GEOCODER_URL: http://127.0.0.1:4010
      WEATHER_CACHE_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecoscape-ops/package-lock.json
      - run: npm ci
      - run: npx supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          node -e 'const s = require(process.argv[1]); require("fs").writeFileSync(".env.local", `NEXT_PUBLIC_SUPABASE_URL=${s.API_URL}\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${s.PUBLISHABLE_KEY}\n`)' "$RUNNER_TEMP/supabase.json"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the app and the fake weather and address services
        run: |
          nohup node tests/e2e/fake-services.mjs > "$RUNNER_TEMP/fake.log" 2>&1 &
          nohup npm run start -- --port 3000 > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login > /dev/null && break; sleep 2; done
      - name: Tour every page
        run: node scripts/audit-tour.mjs "$RUNNER_TEMP/supabase.json" "$RUNNER_TEMP/shots"
      - name: Save the server log
        if: ${{ !cancelled() }}
        run: mkdir -p "$RUNNER_TEMP/shots" && tail -c 200000 "$RUNNER_TEMP/app.log" > "$RUNNER_TEMP/shots/app.log" || true
      - name: Publish to the audit-shots branch
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/shots
        run: |
          git init -q
          git checkout -q -b audit-shots
          git add -A
          git -c user.name="audit" -c user.email="audit@example.com" commit -qm "Screenshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" audit-shots
