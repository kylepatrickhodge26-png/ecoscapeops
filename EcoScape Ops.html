<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>EcoScape Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --moss-900:#182B21;
  --moss-800:#213A2C;
  --moss-700:#33513F;
  --moss-600:#4A6B55;
  --sage:#8FA888;
  --paper:#F3F1E9;
  --paper-2:#EAE7DA;
  --ink:#201F1B;
  --ink-soft:#5B5A52;
  --line:#D9D4C4;
  --sky:#4A7A94;
  --sky-soft:#DCE9EE;
  --clay:#B5622D;
  --clay-soft:#F3E0D2;
  --storm:#6E4FA3;
  --storm-soft:#E8E0F3;
  --sun:#C9962E;
  --sun-soft:#F2E6C7;
  --danger:#A23B34;
  --white:#FFFEFC;
  --radius:3px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15130F; --paper-2:#1D1B15; --ink:#EDE9DD; --ink-soft:#B6B1A0; --line:#3A3627; --white:#1F1D17;
  }
}
:root[data-theme="dark"]{
  --paper:#15130F; --paper-2:#1D1B15; --ink:#EDE9DD; --ink-soft:#B6B1A0; --line:#3A3627; --white:#1F1D17;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; letter-spacing:0.01em;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
::selection{background:var(--sun-soft);}

#app{display:flex; min-height:100vh; max-width:1400px; margin:0 auto;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:230px; flex-shrink:0; background:var(--moss-900); color:#EFE9D8;
  display:flex; flex-direction:column; min-height:100vh; position:sticky; top:0;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,0.08);}
.brand .name{font-family:'Fraunces',serif; font-weight:600; font-size:19px; line-height:1.15;}
.brand .sub{font-size:11px; color:#A9C2AE; margin-top:3px;}
.rolebar{padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.08);}
.rolebar label{display:block; font-size:10px; text-transform:none; color:#9FB6A6; margin-bottom:6px;}
.roleToggle{display:flex; background:rgba(255,255,255,0.06); border-radius:var(--radius); padding:2px;}
.roleToggle button{flex:1; border:none; background:transparent; color:#CFE0D3; font-size:12px; padding:6px 4px; border-radius:2px;}
.roleToggle button.active{background:var(--sage); color:var(--moss-900); font-weight:600;}
nav{flex:1; padding:10px 0; overflow-y:auto;}
nav .item{
  display:flex; align-items:center; gap:10px; padding:10px 20px; font-size:13.5px;
  color:#CFE0D3; border-left:3px solid transparent; cursor:pointer;
}
nav .item:hover{background:rgba(255,255,255,0.05);}
nav .item.active{border-left-color:var(--sage); background:rgba(255,255,255,0.07); color:#fff; font-weight:600;}
nav .item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0.55;}
.sidebar-foot{padding:14px 20px; font-size:11px; color:#7E9686; border-top:1px solid rgba(255,255,255,0.08);}

/* ---------- Main ---------- */
main{flex:1; min-width:0; padding:28px 34px 60px; overflow-x:hidden;}
.pagehead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
.pagehead h1{font-size:24px; font-weight:600; margin:0;}
.pagehead .meta{color:var(--ink-soft); font-size:12.5px;}

.btn{
  border:1px solid var(--moss-700); background:var(--moss-800); color:#fff;
  padding:8px 14px; border-radius:var(--radius); font-size:13px; font-weight:600;
}
.btn:hover{background:var(--moss-700);}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--line);}
.btn.secondary:hover{background:var(--paper-2);}
.btn.danger{background:var(--danger); border-color:var(--danger);}
.btn.small{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:0.45; cursor:not-allowed;}

/* Dashboard grid */
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.grid.g3{grid-template-columns:repeat(3,1fr);}
.card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
.card .label{font-size:11px; color:var(--ink-soft); margin-bottom:8px;}
.card .big{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1;}
.card .sub{font-size:12px; color:var(--ink-soft); margin-top:6px;}
.card.accent-clay{border-left:3px solid var(--clay);}
.card.accent-sun{border-left:3px solid var(--sun);}
.card.accent-sky{border-left:3px solid var(--sky);}
.card.accent-sage{border-left:3px solid var(--sage);}

.panel{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:20px;}
.panel-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
.panel-head h3{margin:0; font-size:15px; font-weight:600;}
.panel-body{padding:16px 18px; overflow-x:auto; -webkit-overflow-scrolling:touch;}

table{width:100%; min-width:520px; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; color:var(--ink-soft); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr.clickable:hover{background:var(--paper-2); cursor:pointer;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.pill.completed{background:#E3ECE0; color:#385C3F;}
.pill.scheduled{background:var(--sky-soft); color:var(--sky);}
.pill.attention{background:var(--sun-soft); color:#8A6414;}
.pill.weather{background:var(--storm-soft); color:var(--storm);}
.pill.cancelled{background:#E7E4D8; color:var(--ink-soft);}
.pill.paid{background:#E3ECE0; color:#385C3F;}
.pill.unpaid{background:var(--sun-soft); color:#8A6414;}
.pill.overdue{background:var(--clay-soft); color:var(--clay);}
.pill.draft{background:#E7E4D8; color:var(--ink-soft);}

/* Status shapes — so job status reads by silhouette, not color alone (helps on tiny
   calendar dots, and for anyone who has trouble telling amber from orange apart). */
.status-shape{display:inline-block; vertical-align:middle; flex-shrink:0; width:9px; height:9px;}
.status-shape.scheduled{border-radius:50%; background:var(--sky);}
.status-shape.completed{border-radius:2px; background:#2F6844;}
.status-shape.attention{background:#8A6414; clip-path:polygon(50% 0%, 0% 100%, 100% 100%);}
.status-shape.weather{background:var(--storm); clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);}
.status-shape.cancelled{width:10px; height:3px; border-radius:2px; background:var(--ink-soft);}

.empty{padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:13px;}
.empty .big{font-family:'Fraunces',serif; font-size:17px; color:var(--ink); margin-bottom:4px;}

/* forms */
.field{margin-bottom:12px;}
.field label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px;}
.field input, .field select, .field textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--white); color:var(--ink); font-size:13.5px; font-family:inherit;
}
.field textarea{resize:vertical; min-height:60px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}

/* modal */
.overlay{position:fixed; left:0; top:0; width:100%; height:var(--vvh, 100vh); background:rgba(20,20,15,0.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:50;}
.modal{background:var(--white); border-radius:var(--radius); width:100%; max-width:560px; border:1px solid var(--line);}
.modal.wide{max-width:700px;}
.modal-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{margin:0; font-size:16px;}
.modal-body{padding:20px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
.x{background:none; border:none; font-size:18px; color:var(--ink-soft); line-height:1;}

.tabbar{display:flex; gap:2px; margin-bottom:16px; border-bottom:1px solid var(--line);}
.tabbar button{background:none; border:none; padding:9px 14px; font-size:13px; color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px;}
.tabbar button.active{color:var(--ink); font-weight:600; border-bottom-color:var(--moss-700);}

.service-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
.service-row:last-child{border-bottom:none;}

.calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.cal-dow{background:var(--paper-2); padding:6px 8px; font-size:10.5px; font-weight:600; color:var(--ink-soft);}
.cal-cell{background:var(--white); min-height:88px; padding:6px; font-size:11.5px;}
.cal-cell .datenum{font-size:11px; color:var(--ink-soft); margin-bottom:4px;}
.cal-cell.other-month{background:var(--paper);}
.cal-cell.other-month .datenum{opacity:0.4;}
.cal-job{padding:2px 5px; border-radius:2px; margin-bottom:2px; font-size:10.5px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cal-job .status-shape{margin-right:4px;}
.cal-job.scheduled, .legend-swatch.scheduled{background:var(--sky-soft); color:#2E5A6E;}
.cal-job.completed, .legend-swatch.completed{background:#E3ECE0; color:#385C3F;}
.cal-job.attention, .legend-swatch.attention{background:var(--sun-soft); color:#8A6414;}
.cal-job.weather, .legend-swatch.weather{background:var(--storm-soft); color:var(--storm);}
.cal-job.cancelled{background:#E7E4D8; color:var(--ink-soft); text-decoration:line-through;}
.legend-swatch{padding:1px 6px; border-radius:2px; display:inline-block;}
.cal-legend{font-size:11.5px; color:var(--ink-soft); display:flex; gap:12px; flex-wrap:wrap;}
.cal-legend .status-shape{margin-right:4px;}
.cal-header-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
.cal-cell.clickable-day{cursor:pointer;}

.weather-banner{background:var(--clay-soft); border:1px solid #E0B698; border-radius:var(--radius); padding:14px 16px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;}
.weather-banner .msg{font-size:13.5px; color:#7A3A1B;}
.weather-banner .msg b{display:block; font-size:14.5px; margin-bottom:2px; font-family:'Fraunces',serif;}

.notice{border:1px solid var(--line); background:var(--paper-2); border-radius:var(--radius); padding:10px 14px; font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}

.jobitem{border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; background:var(--white);}
.jobitem .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.jobitem .cust{font-weight:600; font-size:14.5px;}
.jobitem .addr{color:var(--ink-soft); font-size:12px; margin-top:2px;}
.jobitem .svc{font-size:12.5px; margin-top:6px;}
.jobitem .actions{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;}

.reschedule-row{display:grid; grid-template-columns:1.4fr 1fr auto 1fr; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
.reschedule-row:last-child{border-bottom:none;}
.arrow{color:var(--ink-soft);}

.toast{position:fixed; bottom:20px; right:20px; background:var(--moss-900); color:#fff; padding:11px 16px; border-radius:var(--radius); font-size:13px; z-index:80; box-shadow:0 4px 16px rgba(0,0,0,0.2);}

@media (max-width:900px){
  #app{flex-direction:column;}
  .sidebar{width:100%; position:relative; min-height:auto; padding-top:env(safe-area-inset-top,0px);}
  .brand{padding:12px 16px 10px;}
  .brand .sub{display:none;}
  .rolebar{padding:8px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:none;}
  .rolebar label{display:none;}
  .roleToggle{width:auto; min-width:140px;}
  nav{display:flex; overflow-x:auto; padding:2px 10px 8px; -webkit-overflow-scrolling:touch;}
  nav .item{border-left:none; border-bottom:3px solid transparent; white-space:nowrap; padding:10px 14px; font-size:14px;}
  nav .item.active{border-bottom-color:var(--sage);}
  .sidebar-foot{display:none;}
  .grid, .grid.g3, .row2, .row3{grid-template-columns:1fr;}
  main{padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px));}
  .reschedule-row{grid-template-columns:1fr;}
  .pagehead{gap:12px;}
  .pagehead h1{font-size:20px;}

  /* iOS Safari zooms the page when a focused input is under 16px — keep form fields at 16px+ */
  .field input, .field select, .field textarea{font-size:16px; padding:10px 12px;}
  .btn{padding:11px 16px; font-size:14px;}
  .btn.small{padding:8px 12px; font-size:13px;}
  table{font-size:12.5px;}
  td, th{padding:9px 8px;}

  .overlay{padding:0; align-items:flex-end;}
  .modal{max-width:100%; width:100%; border-radius:12px 12px 0 0; max-height:calc(var(--vvh, 100vh) * 0.85); display:flex; flex-direction:column;}
  .modal-body{max-height:none; flex:1;}
  .modal-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));}
  .toast{left:14px; right:14px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); text-align:center;}

  /* Calendar: names don't fit 7 columns on a phone — show a shape per day, tap the day for the list.
     The outer .cal-job becomes just a layout wrapper; the inner .status-shape carries the actual
     color+shape, sized up a bit so triangle/diamond read clearly at a glance. */
  .cal-dow{padding:4px 2px; font-size:9.5px; text-align:center;}
  .cal-cell{min-height:46px; padding:4px 2px;}
  .cal-cell .datenum{font-size:10px; text-align:center; margin-bottom:3px;}
  .cal-job{
    background:transparent !important; color:transparent !important;
    font-size:0; line-height:0; height:auto; width:auto; min-width:0; padding:0;
    margin:0 2px 3px; display:inline-flex; text-overflow:clip; white-space:normal;
  }
  .cal-job .status-shape{ width:9px; height:9px; margin-right:0; }
  .cal-job.attention .status-shape, .cal-job.weather .status-shape{ width:10px; height:10px; }
  .cal-job.cancelled .status-shape{ width:11px; height:4px; }
  .cal-cell > div:not(.datenum){ display:flex; justify-content:center; flex-wrap:wrap; align-items:center; }
  .cal-cell .more-count{font-size:0;} /* hide "+N more" text, shapes already show density */
  .cal-legend{font-size:10.5px; gap:8px; justify-content:center; width:100%; margin-top:4px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){

/* ============================ STATE ============================ */
const S = {
  role: 'owner',
  tab: 'dashboard',
  customers: [],
  jobs: [],
  invoices: [],
  expenses: [],
  settings: { businessName: 'EcoScape', autoInvoice: false, nextInvoiceNum: 1001, homeBase: '61 Clarendon Road', crewMembers: [{name:'Kyle', pin:null}], ownerPin: null },
  ready: false,
  calMonth: (()=>{const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()};})(),
  scheduleView: 'calendar'
};

let db = null;
let mcpClient = null;
let weatherState = { status:'idle', forecast:null, error:null }; // idle|loading|ready|error|unavailable

async function initWeather(){
  try{ mcpClient = await claude.use('mcp'); }catch(e){ mcpClient = null; }
  if(!mcpClient){ weatherState.status='unavailable'; return; }
  try{
    if(!S.settings.weatherLocationKey){
      const res = await mcpClient.callTool('AccuWeather®','widgets-search-claude',{queryParams:{query:'Lake Ronkonkoma, NY'}});
      const results = res.payload && res.payload.results;
      if(results && results[0]){ S.settings.weatherLocationKey = results[0].locationKey; saveSettings(); }
    }
  }catch(e){ /* leave unset — loadWeatherForecast degrades below */ }
  loadWeatherForecast();
}

/* ============================ REAL ROUTE ORDERING (TomTom) ============================ */
let routeCalcState = 'idle'; // idle|working|error
function haversineMeters(a, b){
  const R = 6371000, toRad = d=>d*Math.PI/180;
  const dLat = toRad(b.lat-a.lat), dLon = toRad(b.lon-a.lon);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
async function geocodeAddress(address){
  const res = await mcpClient.callTool('TomTom Maps','tomtom-geocode',{query: address, limit: 1, countries: ['US']});
  const f = res.payload && res.payload.features && res.payload.features[0];
  if(!f) return null;
  const [lon, lat] = f.geometry.coordinates;
  return {lat, lon};
}
async function ensureHomeBaseCoords(){
  if(S.settings.homeBaseCoords) return S.settings.homeBaseCoords;
  const coords = await geocodeAddress(S.settings.homeBase + ', Lake Ronkonkoma, NY');
  if(coords){ S.settings.homeBaseCoords = coords; saveSettings(); }
  return coords;
}
async function ensureCustomerCoords(c){
  if(c.geo) return c.geo;
  // A bare street address with no city/state is ambiguous worldwide — TomTom will happily
  // match "Clarendon Road" to Sydney or Manchester instead of Lake Ronkonkoma. Anchor every
  // customer geocode to the service area the same way the shop address already is.
  const coords = await geocodeAddress(c.address + ', Lake Ronkonkoma, NY');
  if(coords){ c.geo = coords; saveCustomer(c); }
  return coords;
}

// Orders a day's jobs by actual road-network-adjacent straight-line distance from the shop,
// nearest stop first each step (a standard, fast route heuristic — not a full TSP solve).
// Then makes one real TomTom routing call on the final order to show actual drive time.
async function calculateRealRouteOrder(dateStr, startAddressOverride){
  if(!mcpClient){ toast('TomTom Maps is not connected'); return; }
  routeCalcState = 'working'; render();
  try{
    const home = startAddressOverride ? await geocodeAddress(startAddressOverride) : await ensureHomeBaseCoords();
    if(!home){ toast('Could not locate that starting address'); routeCalcState='idle'; render(); return; }
    const jobs = S.jobs.filter(j=>j.date===dateStr && j.status!=='cancelled');
    const stops = [];
    for(const j of jobs){
      const c = getCustomer(j.customerId);
      if(!c) continue;
      const coords = await ensureCustomerCoords(c);
      if(coords) stops.push({job:j, coords});
    }
    // Greedy nearest-neighbor from the shop.
    const remaining = stops.slice();
    const ordered = [];
    let current = home;
    while(remaining.length){
      let bestIdx = 0, bestDist = Infinity;
      remaining.forEach((s,i)=>{ const d = haversineMeters(current, s.coords); if(d<bestDist){ bestDist=d; bestIdx=i; } });
      const [next] = remaining.splice(bestIdx,1);
      ordered.push(next);
      current = next.coords;
    }
    ordered.forEach((s,i)=>{ s.job.routeOrder = i; saveJob(s.job); });

    // One real routing call for actual drive time across the whole ordered route.
    if(ordered.length){
      const locations = [[home.lon,home.lat], ...ordered.map(s=>[s.coords.lon, s.coords.lat])];
      try{
        const routeRes = await mcpClient.callTool('TomTom Maps','tomtom-routing',{locations, response_detail:'compact'});
        const summary = routeRes.payload.features[0].properties.summary;
        const miles = (summary.lengthInMeters/1609.34).toFixed(1);
        const mins = Math.round(summary.travelTimeInSeconds/60);
        toast(`Route set — ${miles} mi, about ${mins} min driving`);
      }catch(e){ toast('Route order set (drive time unavailable)'); }
    } else {
      toast('Nothing to route that day');
    }
  }catch(e){
    toast('Could not calculate route right now');
  }
  routeCalcState = 'idle';
  render();
}

function loadWeatherForecast(){
  if(!mcpClient || !S.settings.weatherLocationKey){ weatherState = {status:'unavailable', forecast:null, error:null}; render(); return; }
  weatherState.status='loading'; render();
  mcpClient.watchTool('AccuWeather®','widgets-daily-claude',
    {queryParams:{locationKey:S.settings.weatherLocationKey, unit:'imperial'}},
    (ev)=>{
      if(ev.type==='data'){
        weatherState = { status:'ready', forecast: ev.result.payload.dailyForecast, error:null };
      } else {
        // Keep any stale forecast visible for transient failures; only clear it on an auth/consent problem.
        const retract = ['needs_reauth','server_not_connected','blocked_by_policy','consent_required'].includes(ev.error.code);
        weatherState = { status:'error', forecast: retract? null : weatherState.forecast, error: ev.error };
      }
      render();
    },

// Rain risk for a specific app date string ("2026-09-22"), reading the live forecast.
function rainChanceForDate(dateStr){
  if(!weatherState.forecast) return null;
  const day = weatherState.forecast.find(d=>d.date && d.date.slice(0,10)===dateStr);
  return day ? Math.max(day.day.rainProbabilityValue||0, day.night.rainProbabilityValue||0) : null;
}
function topRainRisk(){
  const candidates = [todayStr(), addDays(todayStr(),1), addDays(todayStr(),2)];
  let best = null;
  candidates.forEach(d=>{
    const chance = rainChanceForDate(d);
    if(chance!=null && (best===null || chance>best.chance)) best = {date:d, chance};
  });
  return best;
}
function renderWeatherCardInner(){
  const btn = `<button id="weatherBtn" style="background:none;border:none;padding:0;color:var(--clay);font-weight:600;font-size:12px;cursor:pointer">Text customers →</button>`;
  if(!weatherState.forecast){
    // Not connected, still loading, or a hard auth failure with nothing cached — fall back to the plain manual card.
    const sub = weatherState.status==='loading' ? `<span style="color:var(--ink-soft)">Checking forecast…</span>` : btn;
    return `<div class="label">WEATHER</div><div class="big">☂</div><div class="sub">${sub}</div>`;
  }
  const risk = topRainRisk();
  const big = risk ? risk.chance+'%' : '☂';
  const dayLabel = !risk ? '' : risk.date===todayStr() ? 'today' : risk.date===addDays(todayStr(),1) ? 'tomorrow' : fmtDate(risk.date);
  const staleTag = weatherState.status==='error' ? ' <span title="Could not refresh — showing last known forecast">⚠</span>' : '';
  return `<div class="label">WEATHER</div><div class="big">${big}${staleTag}</div><div class="sub">${risk?`rain chance ${dayLabel} · `:'no rain risk this week · '}${btn}</div>`;
}

function fmtISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(dateStr, n){ const d=parseISO(dateStr); d.setDate(d.getDate()+n); return fmtISO(d); }
function fmtDate(s){ if(!s) return '—'; const d=parseISO(s); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtDateFull(s){ if(!s) return '—'; const d=parseISO(s); return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function money(n){ n=n||0; const sign = n<0?'-':''; return sign + '$' + Math.abs(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

const FREQ_DAYS = { 'weekly':7, 'biweekly':14, 'triweekly':21 };
// Accept whatever the person actually types — "bi weekly", "Bi-Weekly", "tri weekly", etc. —
// not just the exact dropdown value.
function normalizeFrequency(raw){
  const s = (raw||'').toLowerCase().replace(/[\s-]+/g,'');
  if(s==='weekly') return 'weekly';
  if(s==='biweekly'||s==='everytwoweeks'||s==='every2weeks') return 'biweekly';
  if(s==='triweekly'||s==='everythreeweeks'||s==='every3weeks') return 'triweekly';
  if(s==='onetime'||s==='once'||s==='') return 'one-time';
  return raw.trim(); // custom/unrecognized text is kept as-is and treated like one-time for scheduling
}

function freqLabel(freq){
  if(freq==='one-time') return 'one-time';
  return 'every ' + ({weekly:'week', biweekly:'2 weeks', triweekly:'3 weeks'}[freq] || freq);
}

/* ============================ PERSISTENCE ============================ */
async function initDb(){
  try{
    db = await claude.use('db');
  }catch(e){ db = null; }
  if(!db){
    S.ready = true;
    seedIfEmpty();
    reindexCustomers();
    render();
    return;
  }
  try{
    const [custSnap, jobSnap, invSnap, expSnap, setSnap] = await Promise.all([
      db.collection('customers').get(),
      db.collection('jobs').get(),
      db.collection('invoices').get(),
      db.collection('expenses').get(),
      db.doc('app/settings').get()
    ]);
    // The db layer returns protected/non-extensible snapshot data — pushing into a loaded
    // array (e.g. c.services.push(...)) throws "object is not extensible". Deep-clone
    // everything on the way in so it's ordinary, fully mutable data from here on.
    const clone = (x) => JSON.parse(JSON.stringify(x));
    S.customers = custSnap.docs.map(d=>{ const data=clone(d.data()); return {id:d.id, ...data, services: Array.isArray(data.services)?data.services:[]}; });
    S.jobs = jobSnap.docs.map(d=>({id:d.id, ...clone(d.data())}));
    S.invoices = invSnap.docs.map(d=>({id:d.id, ...clone(d.data())}));
    S.expenses = expSnap.docs.map(d=>({id:d.id, ...clone(d.data())}));
    if(setSnap && setSnap.exists) S.settings = {...S.settings, ...clone(setSnap.data())};
  }catch(e){ console.warn('db load failed', e); }
  // Migrate an older plain-string crew list (from before PINs existed) into the new shape.
  S.settings.crewMembers = (S.settings.crewMembers||[]).map(m => typeof m==='string' ? {name:m, pin:null} : m);
  // If an owner PIN is set, don't land in Owner view by default — that would make the PIN pointless.
  if(S.settings.ownerPin) S.role = 'crew';
  S.ready = true;
  if(S.customers.length===0 && S.jobs.length===0){ seedIfEmpty(); }
  reindexCustomers();
  render();
}

function nextWeekdayOnOrAfter(dateStr, weekday){ // 0=Sun..6=Sat
  let d = parseISO(dateStr);

}

/* ============================ RECURRENCE ============================ */
function generateOccurrences(startDate, frequency, count){
  const interval = FREQ_DAYS[frequency];
  const out = [startDate];
  if(!interval) return out; // one-time or custom
  let cur = startDate;
  for(let i=1;i<count;i++){ cur = addDays(cur, interval); out.push(cur); }
  return out;
}

function jobsToday(){ return jobsForDateInRouteOrder(todayStr()); }
function jobsTomorrow(){ return S.jobs.filter(j=>j.date===addDays(todayStr(),1)); }
function jobsThisWeek(){ const end = addDays(todayStr(),7); return S.jobs.filter(j=>j.date>=todayStr() && j.date<=end); }
function monthRevenue(){
  const ym = todayStr().slice(0,7);
  // "Estimated" — this counts every active (non-cancelled) job booked this month at its
  // price, whether or not it's been marked completed yet. It's a projection for the month,
  // not a strict paid-and-received figure — that distinction belongs to invoicing, not here.
  return S.jobs.filter(j=>j.date.startsWith(ym) && j.status!=='cancelled').reduce((sum,j)=>sum+(j.price||0),0);
}
function monthExpenses(){
  const ym = todayStr().slice(0,7);
  return S.expenses.filter(e=>e.date.startsWith(ym)).reduce((sum,e)=>sum+(e.amount||0),0);
}
function outstandingTotal(){ return S.invoices.filter(i=>i.status!=='paid' && i.status!=='cancelled' && i.status!=='draft').reduce((s,i)=>s+(i.total-(i.paidAmount||0)),0); }
function overdueTotal(){ return S.invoices.filter(i=>invoiceStatusLive(i)==='overdue').reduce((s,i)=>s+(i.total-(i.paidAmount||0)),0); }
function invoiceStatusLive(inv){
  if(inv.status==='paid' || inv.status==='cancelled' || inv.status==='draft') return inv.status;
  const bal = inv.total - (inv.paidAmount||0);
  if(bal<=0) return 'paid';
  if(inv.dueDate && inv.dueDate < todayStr()) return 'overdue';
  if((inv.paidAmount||0) > 0) return 'partial';
  return 'sent';
}

  `, ()=>{
    c.firstName=val('f_fn'); c.lastName=val('f_ln'); c.phone=val('f_phone'); c.email=val('f_email');

    c.smsOptIn = document.getElementById('f_sms').checked;

    if(isNew && digits(c.phone)){
      const dup = S.customers.find(x=>digits(x.phone)===digits(c.phone));
      if(dup){
        confirmAction(`${customerName(dup)} already has this phone number on file — could this be the same customer? Add ${customerName(c)} anyway?`, ()=>finishSaveCustomer(c, isNew), 'Add anyway');
        return false;
      }
    }
    finishSaveCustomer(c, isNew);
    return true;
  });
}
function finishSaveCustomer(c, isNew){
    if(isNew){
      c.paymentStatus='current'; S.customers.push(c);
    } else {
      const existingRef = getCustomer(c.id);
      if(existingRef) Object.assign(existingRef, c); else S.customers.push(c);
    }
    reindexCustomers();
    saveCustomer(c); closeModal();
    if(isNew) promptRecurringSetup(c); else render();
}
function val(id){ return document.getElementById(id).value.trim(); }

// After adding a brand-new customer, offer to set up their recurring service right away —

  const overlay = showModal('Update upcoming visits too?', `

    <p style="margin:0;color:var(--ink-soft)">${freq!==oldFreq ? `Since the frequency changed, updating will re-space those visits starting from ${fmtDateDow(futureJobs[0].date)} using the new ${freqLabel(freq)} cadence.` : 'Updating will just refresh the name and price on those visits — dates stay the same.'}</p>
  `, null, {noFooter:true});
  const modal = overlay.querySelector('.modal');
  const footer = document.createElement('div');
  footer.className = 'modal-foot';
  footer.innerHTML = `<button class="btn secondary" data-skip>Leave them as-is</button><button class="btn" data-update>Update ${futureJobs.length===1?'it':'them'}</button>`;
  modal.appendChild(footer);
  modal.querySelector('[data-skip]').onclick = ()=>{ closeModal(); openCustomerDetail(c.id); };
  modal.querySelector('[data-update]').onclick = ()=>{
    if(freq!==oldFreq){
      const dates = generateOccurrences(futureJobs[0].date, freq, futureJobs.length);

    closeModal(); openCustomerDetail(c.id); toast(`Updated ${futureJobs.length} upcoming visit${futureJobs.length===1?'':'s'}`);
  };
}

function orphanedJobs(){ return S.jobs.filter(j=>!getCustomer(j.customerId)); }

// Manual route order for a single day's jobs — real turn-by-turn distance needs a mapping
// service this page can't call directly, so instead the owner sets the closest-to-furthest
// order themselves once (starting from the shop address) and the app remembers it per job.
function jobsForDateInRouteOrder(dateStr){
  return S.jobs.filter(j=>j.date===dateStr)
    .sort((a,b)=>(a.routeOrder??9999)-(b.routeOrder??9999) || a.id.localeCompare(b.id));
}
function moveJobInRoute(dateStr, jobId, delta){
  const ordered = jobsForDateInRouteOrder(dateStr);
  const idx = ordered.findIndex(j=>j.id===jobId);
  const swapWith = idx+delta;
  if(idx<0 || swapWith<0 || swapWith>=ordered.length) return;
  [ordered[idx], ordered[swapWith]] = [ordered[swapWith], ordered[idx]];
  ordered.forEach((j,i)=>{ j.routeOrder = i; saveJob(j); });
  render();
}

    ? `<div class="notice">Live forecast: ${todayRain!=null?`${todayRain}% rain today`:'—'}${tmrwRain!=null?`, ${tmrwRain}% tomorrow`:''}.</div>`

function renderCalendar(holder){
  const {y,m} = S.calMonth;
  const first = new Date(y,m,1); const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push({day: prevDays-startDow+1+i, other:true, dateStr: fmtISO(new Date(y,m-1,prevDays-startDow+1+i))});
  for(let d=1; d<=daysInMonth; d++) cells.push({day:d, other:false, dateStr: fmtISO(new Date(y,m,d))});
  while(cells.length % 7 !== 0) { const n = cells.length - (startDow+daysInMonth) + 1; cells.push({day:n, other:true, dateStr: fmtISO(new Date(y,m+1,n))}); }

  const monthLabel = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  holder.innerHTML = `
    <div class="cal-header-row">
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn secondary small" id="prevM">←</button>
        <div style="font-family:'Fraunces',serif;font-size:16px;font-weight:600;min-width:170px;text-align:center">${monthLabel}</div>
        <button class="btn secondary small" id="nextM">→</button>
      </div>
      <div class="cal-legend">
        <span><span class="status-shape scheduled"></span> Scheduled</span>
        <span><span class="status-shape completed"></span> Completed</span>
        <span><span class="status-shape attention"></span> Needs attention</span>
        <span><span class="status-shape weather"></span> Weather affected</span>
      </div>
    </div>
    <div class="calendar">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(cell=>{
        const dayJobs = S.jobs.filter(j=>j.date===cell.dateStr);
        return `<div class="cal-cell ${cell.other?'other-month':''} ${dayJobs.length?'clickable-day':''}" data-date="${cell.dateStr}">
          <div class="datenum">${cell.day}</div>
          ${dayJobs.slice(0,4).map(j=>{
            const cls = j.status==='completed'?'completed': j.status==='weather delay'?'weather': j.status==='unable to complete'?'attention': j.status==='cancelled'?'cancelled':'scheduled';
            const name = esc(customerName(getCustomer(j.customerId)));
            return `<div class="cal-job ${cls}" data-job="${j.id}" title="${name}"><span class="status-shape ${cls}"></span>${name}</div>`;
          }).join('')}
          ${dayJobs.length>4? `<div class="more-count" style="font-size:10px;color:var(--ink-soft)">+${dayJobs.length-4} more</div>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
  holder.querySelector('#prevM').onclick=()=>{ S.calMonth.m--; if(S.calMonth.m<0){S.calMonth.m=11;S.calMonth.y--;} render(); };
  holder.querySelector('#nextM').onclick=()=>{ S.calMonth.m++; if(S.calMonth.m>11){S.calMonth.m=0;S.calMonth.y++;} render(); };
  holder.querySelectorAll('[data-job]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openJobModal(el.dataset.job); });
  holder.querySelectorAll('.cal-cell.clickable-day').forEach(cell=>cell.onclick=()=>{
    const jobs = S.jobs.filter(j=>j.date===cell.dataset.date);
    if(jobs.length===1) openJobModal(jobs[0].id); else openDayJobsModal(cell.dataset.date, jobs);
  });
}

function openJobModal(id){

      </div>

      S.jobs = S.jobs.filter(x=>x.id!==j.id); deleteJob(j.id); closeModal(); render();
    });
  };
}

function createInvoiceForJob(job){
  const c = getCustomer(job.customerId);
  const num = S.settings.nextInvoiceNum++; saveSettings();
  const inv = {
    id: uid(), customerId: job.customerId, jobIds:[job.id], number: num,
    date: todayStr(), dueDate: addDays(todayStr(),14),
    items: [{desc: job.service, qty:1, price: job.price}],
    total: job.price, paidAmount: 0, status: 'sent'
  };
  S.invoices.push(inv); saveInvoice(inv);
  toast(`Invoice #${num} created for ${customerName(c)}`);
}

        ${list.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.vendor||'—')}</td><td>${money(e.amount)}</td><td>${esc(e.notes||'')}</td></tr>`).join('')}
      </tbody></table>`: `<div class="empty">No expenses logged yet.</div>`}
    </div></div>
  `;
  main.querySelector('#addExp').onclick=()=>openAddExpenseModal();
}

function openAddExpenseModal(defaultCategory){
  const cats = ['Fuel','Equipment','Repairs','Materials','Fertilizer','Mulch','Payroll/labor','Insurance','Advertising','Vehicle','Other'];
  showModal('Add expense', `
    <div class="row2">
      <div class="field"><label>Date</label><input id="e_date" type="date" value="${todayStr()}"></div>
      <div class="field"><label>Category</label>
        <select id="e_cat">${cats.map(c=>`<option ${c===defaultCategory?'selected':''}>${c}</option>`).join('')}</select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Amount</label><input id="e_amt" type="number" step="0.01"></div>
      <div class="field"><label>Vendor</label><input id="e_vendor"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="e_notes"></textarea></div>
  `, ()=>{
    const amt = parseFloat(val('e_amt'));
    if(isNaN(amt)){ toast('Enter an amount'); return false; }
    const e = {id:uid(), date:document.getElementById('e_date').value, category:val('e_cat'), amount:amt, vendor:val('e_vendor'), notes:val('e_notes')};
    S.expenses.push(e); saveExpense(e); closeModal(); render(); toast('Expense logged');
    return true;
  });
}

/* ============================ EMPLOYEE VIEW ============================ */
// Per-device "who's using this phone" — not real authentication (nothing stops someone
// from picking a different name), but it's enough to show each crew member only the jobs
// assigned to them, remembered locally so they don't have to pick every time.
function getCrewIdentity(){ try{ return localStorage.getItem('ecoscape_crew_identity') || null; }catch(e){ return null; } }
function setCrewIdentity(name){ try{ localStorage.setItem('ecoscape_crew_identity', name); }catch(e){} }
function clearCrewIdentity(){ try{ localStorage.removeItem('ecoscape_crew_identity'); }catch(e){} }

function renderMyDay(main){
  const identity = getCrewIdentity();
  if(!identity){
    main.innerHTML = `
      <div class="pagehead"><h1>Who's this?</h1></div>
      <div class="notice">Pick your name so you only see the jobs assigned to you. This is remembered on this phone — not a password, just a shortcut.</div>
      <div style="display:flex;flex-direction:column;gap:8px;max-width:320px">
        ${S.settings.crewMembers.map(m=>`<button class="btn secondary" data-pick-identity="${esc(m.name)}" style="text-align:left">${esc(m.name)}${m.pin?' 🔒':''}</button>`).join('')}
      </div>
    `;
    main.querySelectorAll('[data-pick-identity]').forEach(b=>b.onclick=()=>{
      const m = S.settings.crewMembers.find(x=>x.name===b.dataset.pickIdentity);
      if(m && m.pin){ promptVerifyPin(`PIN for ${m.name}`, m.pin, ()=>{ setCrewIdentity(m.name); render(); }); }
      else { setCrewIdentity(b.dataset.pickIdentity); render(); }
    });
    return;
  }

  const today = jobsForDateInRouteOrder(todayStr()).filter(j=>j.status!=='cancelled' && j.employee===identity);
  const next = S.jobs.filter(j=>j.date>todayStr() && j.status!=='cancelled' && j.employee===identity).sort((a,b)=>a.date.localeCompare(b.date))[0];

  // Auto-build today's route the first time it's viewed (or whenever a new job shows up
  // without a position yet) instead of making the person tap a button for it.
  if(mcpClient && routeCalcState!=='working' && today.some(j=>j.routeOrder==null)){
    calculateRealRouteOrder(todayStr());
  }

  main.innerHTML = `
    <div class="pagehead"><h1>My jobs — ${fmtDateFull(todayStr())}</h1><button class="btn secondary small" id="switchIdentityBtn">${esc(identity)} · switch</button></div>
    ${today.length? `<div class="notice">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:${routeCalcState==='working'?'0':'8px'}">
        <label style="font-size:11.5px;color:var(--ink-soft);white-space:nowrap">Starting from</label>
        <input id="startFromInput" value="${esc(S.settings.homeBase)}" style="flex:1;min-width:160px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;font-size:12.5px">
        <button class="btn secondary small" id="calcRouteBtn" ${routeCalcState==='working'?'disabled':''}>${routeCalcState==='working'?'Calculating…':'📍 Recalculate'}</button>
      </div>
      ${routeCalcState!=='working'? `<div style="font-size:11.5px;color:var(--ink-soft)">Use the arrows to fine-tune the order, or change the start above and recalculate.</div>`:''}
    </div>`:''}
    ${today.length? today.map((j,i)=>{
      const c = getCustomer(j.customerId);
      return `<div class="jobitem" data-job="${j.id}">
        <div class="top">
          <div style="display:flex;gap:10px;align-items:flex-start">
            <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px">
              <button class="btn secondary small" data-route-up="${j.id}" ${i===0?'disabled':''} style="padding:2px 7px;line-height:1">▲</button>
              <span class="mono" style="font-size:11px;color:var(--ink-soft)">${i+1}</span>
              <button class="btn secondary small" data-route-down="${j.id}" ${i===today.length-1?'disabled':''} style="padding:2px 7px;line-height:1">▼</button>
            </div>
            <div><div class="cust">${esc(customerName(c))}</div><div class="addr">${esc(c?c.address:'')}</div></div>
          </div>
          ${statusPill(j.status)}
        </div>
        <div class="svc">${esc(j.service)}${c && c.serviceNotes? ' — '+esc(c.serviceNotes):''}</div>
        <div class="actions">
          ${['scheduled','assigned','weather delay'].includes(j.status)? `<button class="btn small" data-start="${j.id}">Start job</button>`:''}
          ${j.status==='in progress'||j.status==='en route'? `<button class="btn small" data-complete="${j.id}">Mark completed</button>`:''}
          ${j.status!=='completed'? `<button class="btn secondary small" data-unable="${j.id}">Could not service</button>`:''}
          <button class="btn secondary small" data-notes="${j.id}">Add note</button>
          ${jobUndoHistory.has(j.id)? `<button class="btn secondary small" data-undo="${j.id}">↩ Undo</button>`:''}
        </div>
      </div>`;
    }).join('') : `<div class="empty"><div class="big">No jobs assigned today</div>Check back tomorrow or ask the owner to assign jobs.</div>`}
    ${next? `<div class="notice" style="margin-top:10px">Next up: ${esc(customerName(getCustomer(next.customerId)))} on ${fmtDate(next.date)}</div>`:''}
  `;
  main.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{ setJobStatus(b.dataset.start,'in progress'); });
  main.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{ setJobStatus(b.dataset.complete,'completed'); });
  main.querySelectorAll('[data-unable]').forEach(b=>b.onclick=()=>openCouldNotServiceModal(b.dataset.unable));
  main.querySelectorAll('[data-notes]').forEach(b=>b.onclick=()=>openJobModal(b.dataset.notes));
  main.querySelectorAll('[data-route-up]').forEach(b=>b.onclick=()=>moveJobInRoute(todayStr(), b.dataset.routeUp, -1));
  main.querySelectorAll('[data-route-down]').forEach(b=>b.onclick=()=>moveJobInRoute(todayStr(), b.dataset.routeDown, 1));
  const calcBtn = main.querySelector('#calcRouteBtn');
  if(calcBtn) calcBtn.onclick = ()=>{
    const startFrom = main.querySelector('#startFromInput').value.trim();
    calculateRealRouteOrder(todayStr(), startFrom && startFrom!==S.settings.homeBase ? startFrom : undefined);
  };
  main.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>undoJobAction(b.dataset.undo));
  main.querySelector('#switchIdentityBtn').onclick = ()=>{ clearCrewIdentity(); render(); };
}

// "Could not service" isn't a final answer by itself — the real next step is either
// putting it on a new day or calling it off entirely, so ask which right away.
function openCouldNotServiceModal(id){
  const j = S.jobs.find(x=>x.id===id); if(!j) return;
  const c = getCustomer(j.customerId);
  const overlay = showModal(`Couldn't service — ${customerName(c)}`, `
    <p style="margin:0 0 12px;color:var(--ink-soft)">What should happen to this visit?</p>
    <div class="field"><label>If rescheduling, new date</label><input id="cns_date" type="date" value="${addDays(j.date,1)}"></div>
  `, null, {noFooter:true});
  const modal = overlay.querySelector('.modal');
  const footer = document.createElement('div');
  footer.className = 'modal-foot';
  footer.innerHTML = `<button class="btn danger small" data-cns-cancel style="margin-right:auto">Cancel job</button><button class="btn secondary" data-cns-close>Not now</button><button class="btn" data-cns-reschedule>Reschedule</button>`;
  modal.appendChild(footer);
  modal.querySelector('[data-cns-close]').onclick = closeModal;
  modal.querySelector('[data-cns-cancel]').onclick = ()=>{ setJobStatus(id, 'cancelled'); closeModal(); };
  modal.querySelector('[data-cns-reschedule]').onclick = ()=>{
    const newDate = modal.querySelector('#cns_date').value;
    if(!newDate){ toast('Pick a date'); return; }
    jobUndoHistory.set(id, { prevStatus:j.status, prevCompletedAt:j.completedAt, prevDate:j.date });
    const oldDate = j.date;
    j.date = newDate; j.status = 'scheduled';
    j.notes = (j.notes? j.notes+' — ':'') + `Rescheduled from ${fmtDateDow(oldDate)} — could not service`;
    saveJob(j); closeModal(); render();
    toast(`Rescheduled to ${fmtDateDow(newDate)}`);
  };
}

let jobUndoHistory = new Map(); // jobId -> {prevStatus, prevCompletedAt} — each job remembers its own last change independently
function setJobStatus(id, status){
  const j = S.jobs.find(x=>x.id===id); if(!j) return;
  if(j.status === status) return; // already there — a double-tap shouldn't overwrite undo history with a no-op
  jobUndoHistory.set(id, { prevStatus:j.status, prevCompletedAt:j.completedAt });
  j.status = status;
  if(status==='completed'){ j.completedAt = todayStr(); if(S.settings.autoInvoice) createInvoiceForJob(j); }
  saveJob(j); render();
}
function undoJobAction(id){
  const prev = jobUndoHistory.get(id);
  if(!prev) return;
  const j = S.jobs.find(x=>x.id===id);
  if(j){
    j.status = prev.prevStatus; j.completedAt = prev.prevCompletedAt;
    if(prev.prevDate) j.date = prev.prevDate;
    saveJob(j); toast('Undone');
  }
  jobUndoHistory.delete(id);
  render();
}

/* ============================ MODAL ============================ */
// Modals can stack (e.g. tapping a job while inside the "day's jobs" popup opens
// another one on top). Track them as a real stack keyed by element, not by a
// document-wide id, so closing/wiring always targets the right instance.
let modalStack = [];
function showModal(title, bodyHtml, onSave, opts){
  opts = opts || {};
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal ${opts.wide?'wide':''}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="x" data-close>✕</button></div>
      <div class="modal-body" data-modal-body>${bodyHtml}</div>
      ${opts.noFooter? '' : `<div class="modal-foot"><button class="btn secondary" data-close>Cancel</button>${opts.extraFooter||''}<button class="btn" data-save>${opts.okOnly? 'Close':'Save'}</button></div>`}
    </div>
  `;
  document.body.appendChild(overlay);
  modalStack.push(overlay);
  overlay.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  overlay.onclick=(e)=>{ if(e.target===overlay) closeModal(); };
  if(!opts.noFooter){
    overlay.querySelector('[data-save]').onclick = ()=>{
      if(opts.okOnly){ closeModal(); return; }
      // A bug in one save handler used to be able to crash the whole app (blanking
      // everything behind an already-stuck-open popup). Contain it here instead:
      // show a toast and leave the form as-is so the person can retry or back out.
      let ok;
      try{ ok = onSave && onSave(); }
      catch(err){ console.error(err); toast('Save error: ' + (err && err.message ? err.message : 'unknown error')); return; }
      if(ok===false) return;
    };
  }
  return overlay;
}
function closeModal(){
  const overlay = modalStack.pop();
  if(overlay) overlay.remove();
}
function currentModal(){ return modalStack[modalStack.length-1] || null; }
function currentModalBody(){ const o = currentModal(); return o ? o.querySelector('[data-modal-body]') : null; }

// Published pages run sandboxed — native window.confirm()/alert() get silently blocked
// and just return false with no dialog shown. Use our own modal for confirmations instead.
// Set a new PIN (no verification needed — the owner is already in the settings screen).
function promptForPin(title, onSet){
  const overlay = showModal(title, `
    <div class="field"><label>PIN (numbers, at least 4 digits)</label><input id="pinInput" type="tel" inputmode="numeric" maxlength="8" placeholder="1234"></div>
  `, ()=>{
    const pin = overlay.querySelector('#pinInput').value.trim();
    if(!/^\d{4,8}$/.test(pin)){ toast('Enter at least 4 digits'); return false; }
    closeModal();
    onSet(pin);
    return true;
  });
}
// Verify an existing PIN before granting access to something protected.
function promptVerifyPin(title, correctPin, onSuccess){
  const overlay = showModal(title, `
    <div class="field"><label>Enter PIN</label><input id="pinInput" type="tel" inputmode="numeric" maxlength="8" placeholder="1234"></div>
  `, ()=>{
    const pin = overlay.querySelector('#pinInput').value.trim();
    if(pin !== correctPin){ toast('Wrong PIN'); return false; }
    closeModal();
    onSuccess();
    return true;
  });
}

function confirmAction(message, onConfirm, confirmLabel){
  const overlay = showModal('Please confirm', `<p style="margin:0">${esc(message)}</p>`, null, {noFooter:true});
  const modal = overlay.querySelector('.modal');
  const label = confirmLabel || 'Delete';
  const footer = document.createElement('div');
  footer.className = 'modal-foot';
  footer.innerHTML = `<button class="btn secondary" data-confirm-no>Cancel</button><button class="btn ${confirmLabel?'':'danger'}" data-confirm-yes>${esc(label)}</button>`;
  modal.appendChild(footer);
  modal.querySelector('[data-confirm-no]').onclick = closeModal;
  modal.querySelector('[data-confirm-yes]').onclick = ()=>{ closeModal(); onConfirm(); };
}

/* ============================ BOOT ============================ */
window.addEventListener('error', function(e){
  const app = document.getElementById('app');
  if(app) app.innerHTML = '<div style="padding:40px;font-family:sans-serif;max-width:600px;margin:0 auto;">'
    + '<h2 style="font-family:Georgia,serif">Something went wrong loading EcoScape Ops</h2>'
    + '<p style="color:#555">' + (e && e.message ? e.message : 'Unknown error') + '</p>'
    + '<p style="color:#888;font-size:12px">Try reloading. If this keeps happening, let Kyle know what device/browser you\'re using.</p>'
    + '</div>';
});
// iOS Safari doesn't reliably shrink dvh/vh when the on-screen keyboard opens, which can
// leave a bottom-sheet modal's Save button hidden underneath the keyboard. visualViewport
// tracks the actual visible area (keyboard included) reliably on iOS, so use it as the
// source of truth for how tall a modal is allowed to be.
function updateViewportVar(){
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--vvh', h + 'px');
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', updateViewportVar);
  window.visualViewport.addEventListener('scroll', updateViewportVar);
}
window.addEventListener('resize', updateViewportVar);
updateViewportVar();

render(); // show a loading state immediately, before capabilities/data resolve
initDb();
initWeather();

})();
</script>
